[project]
name = "fxlab"
version = "0.1.0"
description = "Laboratorio de investigación cuantitativa sobre Forex."
readme = "README.md"
requires-python = "==3.11.*"
dependencies = [
    "dukascopy-python>=4.0.1",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "numpy>=1.26",
    "vectorbt==1.1.0",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs>=2.2",
    "types-pyyaml>=6.0.12.20260724",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fxlab"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["dukascopy_python.*", "pyarrow.*", "vectorbt.*", "scipy.*", "plotly.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
